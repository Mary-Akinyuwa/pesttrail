name: Keep PestTrail Awake

on:
  schedule:
    # Ping every 24 hours — well within Streamlit's sleep threshold
    - cron: '0 10 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake PestTrail
        run: |
          echo "Pinging pesttrail.streamlit.app..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -A "Mozilla/5.0 (compatible; keepalive-bot)" \
            https://pesttrail.streamlit.app/)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "App is responding."
          else
            echo "Warning: unexpected status $STATUS"
          fi
