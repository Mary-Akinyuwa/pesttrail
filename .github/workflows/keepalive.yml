name: Keep PestTrail Awake

on:
  schedule:
    # Ping 4× per day — if one GitHub runner slot is unavailable, the others cover it
    - cron: '0 6  * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '0 0  * * *'
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # fail fast if no runner is available; don't hang 15+ min
    steps:
      - name: Wake PestTrail
        run: |
          echo "Pinging pesttrail.streamlit.app..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -A "Mozilla/5.0 (compatible; keepalive-bot)" \
            https://pesttrail.streamlit.app/)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "App is responding."
          else
            echo "Warning: unexpected status $STATUS"
          fi
